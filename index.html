<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth Scroll Animation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Minimalist loading bar -->
  <div id="loader" class="loader-bar"></div>

  <!-- Fullscreen Canvas for Smooth Frame Scrubbing -->
  <canvas id="canvas"></canvas>

  <!-- Scroll Track for Smooth Animation Duration -->
  <div id="scroll-track"></div>

  <script src="script.js"></script>
</body>
</html>
